<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#faf9f5">
  <title>Gas Monitor</title>
  <style>
    :root{--background:#faf9f5;--foreground:#3d3929;--card:#fff;--primary:#c96442;--primary-fg:#fff;--secondary:#e9e6dc;--muted:#ede9de;--muted-fg:#77756e;--border:#dad9d4;--good:#347a53;--warn:#b65737;--radius:8px}
    *{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#c7c4ba transparent}
    *::-webkit-scrollbar{width:12px;height:12px}*::-webkit-scrollbar-track{background:transparent}*::-webkit-scrollbar-thumb{border:3px solid var(--background);border-radius:999px;background:#c7c4ba}
    body{margin:0;min-height:100vh;background:var(--background);color:var(--foreground);font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
    main{width:min(920px,calc(100% - 28px));margin:0 auto;padding:28px 0 40px}
    header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}
    h1{margin:0 0 6px;font-size:24px;line-height:1.2;letter-spacing:-.02em}.sub{margin:0;color:var(--muted-fg);font-size:13px}
    .badge{display:inline-flex;align-items:center;gap:7px;min-height:28px;padding:5px 10px;border:1px solid var(--border);border-radius:999px;background:var(--card);font-size:12px;font-weight:700;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:var(--muted-fg)}.badge.online .dot{background:var(--good)}.badge.warn .dot{background:var(--warn)}
    .hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(240px,.6fr);gap:14px;margin-bottom:14px}
    .panel{min-width:0;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);box-shadow:0 1px 2px rgba(61,57,41,.04)}
    .primary{padding:22px}.eyebrow{margin:0 0 8px;color:var(--muted-fg);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .value-row{display:flex;align-items:baseline;gap:9px;min-width:0}.value{font-size:64px;font-weight:760;line-height:1;letter-spacing:-.055em;font-variant-numeric:tabular-nums}.unit{color:var(--muted-fg);font-size:15px;font-weight:700}
    .level{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);font-size:13px}.level strong{font-size:14px}.level.warning strong{color:var(--warn)}
    .side{display:grid;grid-template-rows:1fr 1fr;gap:14px}.metric{padding:18px}.metric-value{margin-top:8px;font-size:30px;font-weight:740;font-variant-numeric:tabular-nums}.metric-unit{margin-left:5px;color:var(--muted-fg);font-size:12px}.hint{margin:8px 0 0;color:var(--muted-fg);font-size:11px;line-height:1.5}
    .details{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;overflow:hidden;background:var(--border)}.detail{padding:15px;background:var(--card)}.detail span{display:block;color:var(--muted-fg);font-size:11px}.detail strong{display:block;margin-top:5px;font-size:15px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
    .notice{margin-top:14px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--muted);color:#5f5b4f;font-size:12px;line-height:1.65}.notice strong{color:var(--foreground)}
    footer{margin-top:14px;color:var(--muted-fg);font-size:11px;text-align:center}
    @media(max-width:680px){main{width:min(100% - 20px,520px);padding-top:20px}header{align-items:center}.hero{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr;grid-template-rows:auto}.value{font-size:56px}.details{grid-template-columns:1fr}.detail{display:flex;align-items:center;justify-content:space-between;gap:16px}.detail strong{margin:0}}
    @media(max-width:390px){.side{grid-template-columns:1fr}.value{font-size:50px}.primary{padding:18px}.metric{padding:15px}}
  </style>
</head>
<body>
  <main>
    <header><div><h1>室内气体监测</h1><p class="sub">ESP32-S3 · TVOC-301 · SSD1306</p></div><div id="connection" class="badge"><span class="dot"></span><span>正在连接</span></div></header>
    <section class="hero" aria-label="实时气体读数">
      <article class="panel primary"><p class="eyebrow">甲醛 HCHO</p><div class="value-row"><span id="hcho" class="value">--</span><span class="unit">μg/m³</span></div><div id="level" class="level"><span>参考线：80 μg/m³</span><strong>等待数据</strong></div></article>
      <div class="side">
        <article class="panel metric"><p class="eyebrow">TVOC</p><div><span id="tvoc" class="metric-value">--</span><span class="metric-unit">μg/m³</span></div><p class="hint">总挥发性有机物趋势值</p></article>
        <article class="panel metric"><p class="eyebrow">eCO₂</p><div><span id="eco2" class="metric-value">--</span><span class="metric-unit">ppm</span></div><p class="hint">由 MEMS 模型估算，并非真实 CO₂ 测量</p></article>
      </div>
    </section>
    <section class="panel details" aria-label="设备状态">
      <div class="detail"><span>有效数据帧</span><strong id="frames">0</strong></div><div class="detail"><span>校验错误</span><strong id="errors">0</strong></div><div class="detail"><span>采样年龄</span><strong id="age">--</strong></div>
    </section>
    <aside class="notice"><strong>读数边界：</strong>本设备用于趋势观察和通风提醒，不替代专业检测。80 μg/m³ 来自 GB/T 18883-2022 的甲醛 1 小时平均参考要求；这里显示的是廉价 MEMS 模块的瞬时平滑值。</aside>
    <footer>连接设备热点后访问 192.168.4.1 · 页面每秒自动更新</footer>
  </main>
  <script>
    const byId=id=>document.getElementById(id);let polling=false;
    function connection(kind,text){const node=byId('connection');node.className=`badge ${kind}`;node.querySelector('span:last-child').textContent=text}
    function render(data){const online=Boolean(data.sensorOnline);connection(online?(data.level==='at_or_above_reference'?'warn':'online'):'',online?'传感器在线':'传感器离线');byId('hcho').textContent=online?data.hchoUgM3:'--';byId('tvoc').textContent=online?data.tvocUgM3:'--';byId('eco2').textContent=online?data.eco2Ppm:'--';byId('frames').textContent=data.validFrames;byId('errors').textContent=data.checksumErrors;byId('age').textContent=data.validFrames?`${data.sampleAgeMs} ms`:'--';const level=byId('level');const high=online&&data.level==='at_or_above_reference';level.className=`level${high?' warning':''}`;level.querySelector('strong').textContent=!online?'等待有效数据':high?'达到或超过参考线':'低于参考线'}
    async function poll(){if(polling)return;polling=true;try{const response=await fetch('/api/status',{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);render(await response.json())}catch(error){connection('','连接中断')}finally{polling=false}}
    poll();setInterval(poll,1000);
  </script>
</body>
</html>
